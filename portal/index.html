<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Partner Portal — Shirah Brown</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#131315; --char:#1e1e21; --gold:#d4b17c; --gold-dk:#b8945d; --gold-lt:#e8d2a0;
    --muted:#8f8a82;
    --sans:'Figtree','Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--ink);color:#d9d4cc;line-height:1.6;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:32px 20px}
  .card{width:100%;max-width:440px;background:var(--char);border:1px solid rgba(212,177,124,.28);border-radius:14px;padding:40px 34px;text-align:center;display:grid;gap:18px;justify-items:center}
  .card img{width:76px;height:76px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
  h1{font-size:30px;font-weight:700;line-height:1.12;color:#fff;letter-spacing:-0.02em}
  .rule{width:54px;height:3px;background:var(--gold);border-radius:2px}
  p{font-size:15px;color:#bdb7ae;max-width:34ch}
  .btn{display:inline-block;font-size:15px;font-weight:600;padding:13px 26px;border-radius:7px;background:var(--gold);color:#241d12;border:1.5px solid var(--gold);transition:.18s;text-decoration:none}
  .btn:hover{background:var(--gold-dk);border-color:var(--gold-dk)}
  .btn:focus-visible,.back:focus-visible{outline:3px solid var(--gold-lt);outline-offset:3px}
  .small{font-size:13px;color:var(--muted)}
  .back{font-size:13px;color:var(--gold);text-decoration:none}
  .back:hover{text-decoration:underline}
</style>
</head>
<body>
  <main class="card">
    <img src="/assets/logo-smb-shirah.png" alt="SMB · Shirah M. Brown" width="76" height="76">
    <div class="eyebrow">Partner Portal</div>
    <h1>Outreach &amp; Digital Strategy</h1>
    <div class="rule"></div>
    <p>Prospects, client kits, proposals and bookings for partners.</p>
    <a class="btn" href="https://claude.ai/artifact/M4aV4PGc3pQFeMHpVTDafT" rel="noopener">Sign in to the workspace</a>
    <p class="small">Access is by invitation. Sign in with the Claude account your invite was sent to.</p>
    <a class="back" href="/">← Back to shirahbrown.com</a>
  </main>
</body>
</html>
